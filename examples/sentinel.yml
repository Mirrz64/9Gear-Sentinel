# Demo config for the Postgres in docker-compose.yml.
# docker compose up -d, then: sentinel run -c examples/sentinel.yml

version: 1

sources:
  demo:
    type: postgres
    url: ${WAREHOUSE_URL:-postgresql+psycopg://sentinel:sentinel@localhost:5433/analytics}

store:
  url: sqlite:///.sentinel/results.db

alerts:
  notify_on: [fail, error, recovered]
  # Uncomment and set SLACK_WEBHOOK_URL in .env to get alerts in Slack:
  # slack:
  #   webhook_url: ${SLACK_WEBHOOK_URL}

tables:
  - source: demo
    table: analytics.orders
    tags: [core]
    checks:
      - freshness: { column: updated_at, max_age: 6h }
      - row_count: { min: 1 }
      - row_count_change: { max_drop_pct: 30, max_growth_pct: 50 }
      - null_rate: { column: customer_id, max_pct: 1, severity: warn }
      - unique: { columns: [order_id] }
      - accepted_values:
          column: status
          values: [pending, paid, shipped, refunded]
      - custom_sql:
          name: orders_without_customers
          sql: >
            select o.order_id
            from analytics.orders o
            left join analytics.customers c on c.id = o.customer_id
            where o.customer_id is not null and c.id is null
      - schema_drift: {}

  - source: demo
    table: analytics.customers
    checks:
      - freshness: { column: created_at, max_age: 7d }
      - row_count: { min: 100 }
      - not_null: { column: email }
      - unique: { columns: [id] }
      - accepted_values:
          column: country
          values: [GB, NG, CA, US]
