[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ninegear-sentinel"
dynamic = ["version"]
description = "Data quality checks for your warehouse, declared in YAML, run anywhere."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Miracle Osabuogbe" }]
keywords = ["data quality", "data observability", "data engineering", "sql", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "psycopg[binary]>=3.1",
]

[project.urls]
Repository = "https://github.com/Mirrz64/9Gear-Sentinel"

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.hatch.version]
path = "src/sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a running Postgres (set SENTINEL_TEST_PG_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
