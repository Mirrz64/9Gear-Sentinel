name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Linux, Python ${{ matrix.python-version }} (with Postgres)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d analytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SENTINEL_TEST_PG_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy src
      - name: Test
        run: pytest --cov=sentinel --cov-report=term-missing

  test-other-os:
    # Service containers only run on Linux, so Postgres integration tests skip here.
    name: ${{ matrix.os }}, Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Test
        run: pytest
