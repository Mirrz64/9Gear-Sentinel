# Local Postgres with demo data for trying Sentinel and running integration tests.
# Start:  docker compose up -d
# Reset:  docker compose down -v && docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - ./examples/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: only needed to run the MySQL integration tests locally.
  # Start:  docker compose --profile mysql up -d mysql
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: sentinel-root
      MYSQL_DATABASE: analytics
      MYSQL_USER: sentinel
      MYSQL_PASSWORD: sentinel
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -usentinel -psentinel --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
