site_name: 9Gear Sentinel
site_description: Data quality checks for your warehouse, declared in YAML.
site_url: https://mirrz64.github.io/9Gear-Sentinel/
repo_url: https://github.com/Mirrz64/9Gear-Sentinel
repo_name: Mirrz64/9Gear-Sentinel
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Checks: checks.md
  - Alerts: alerts.md
  - Scheduling and CI: scheduling.md
  - CLI reference: cli.md
